# ============================================================
# quietfail-check — ตรวจความล้มเหลวเงียบของ vector search ทุก PR
#
# ทำไมต้องรันใน CI: fault ที่งานนี้วัดได้ 5 ข้อตรวจจาก catalog ล้วน
# ไม่ต้องมีข้อมูล production ไม่ต้องรอให้ปัญหาเกิด — ตรวจได้ตั้งแต่ก่อน merge
#
# นโยบายที่ตั้งใจ:
#   พบปัญหา (DETECTED)      -> fail build
#   ตรวจไม่ได้ (CANNOT_CHECK) -> fail build เช่นกัน (exit 2)
#     เพราะเครื่องมือที่บอกว่า "ปลอดภัย" ทั้งที่ไม่ได้ตรวจอะไรเลย
#     อันตรายกว่าไม่มีเครื่องมือ · ทีมที่ยอมรับได้ใส่ --allow-unknown
# ============================================================
name: quietfail-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        # ล็อกเวอร์ชันเต็ม ไม่ใช้ tag ที่ขยับตาม —
        # tag แบบ :pg17 จะชี้ไปเวอร์ชันใหม่เมื่อไหร่ก็ได้ แล้วผลเทียบกันไม่ได้
        image: pgvector/pgvector:0.8.5-pg17
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: labpass
          POSTGRES_DB: faultlab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lab -d faultlab"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ติดตั้ง psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: เตรียม extension
        env:
          PGPASSWORD: labpass
        run: |
          psql -h localhost -U lab -d faultlab -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"

      # ตรงนี้คือจุดที่ทีมอื่นเอาไปแก้: โหลด schema และข้อมูลของตัวเอง
      # แล้วให้แอปยิง query จริงสักรอบ เพื่อให้ pg_stat_statements มีประวัติ
      - name: โหลด schema ของโปรเจค (ตัวอย่าง)
        env:
          PGPASSWORD: labpass
        run: |
          psql -h localhost -U lab -d faultlab -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS documents (
              id        int PRIMARY KEY,
              category  text NOT NULL,
              embedding vector(384)
          );
          INSERT INTO documents
          SELECT g, 'general',
                 (SELECT array_agg(random())::vector FROM generate_series(1,384))
          FROM generate_series(1, 500) g
          ON CONFLICT DO NOTHING;
          CREATE INDEX IF NOT EXISTS documents_embedding_idx
              ON documents USING hnsw (embedding vector_cosine_ops);
          SQL

      - name: ให้แอปยิง query จริง (เพื่อให้ตรวจ I01 · Q02 ได้)
        env:
          PGPASSWORD: labpass
        run: |
          psql -h localhost -U lab -d faultlab -v ON_ERROR_STOP=1 -c "
            SELECT id FROM documents
             ORDER BY embedding <=> (SELECT embedding FROM documents WHERE id = 1)
             LIMIT 10;"

      - name: quietfail-check
        env:
          PGPASSWORD: labpass
        run: |
          python scripts/quietfail_check.py \
            --dsn "postgresql://lab@localhost:5432/faultlab" \
            --max-limit 10 \
            --github \
            --json quietfail-report.json

      - name: เก็บรายงานไว้ดูย้อนหลัง
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quietfail-report
          path: quietfail-report.json
          if-no-files-found: ignore
