# ============================================================
# quietfail-check — ตรวจความล้มเหลวเงียบของ vector search ทุก PR
#
# ทำไมต้องรันใน CI: fault ที่งานนี้วัดได้ 5 ข้อตรวจจาก catalog ล้วน
# ไม่ต้องมีข้อมูล production ไม่ต้องรอให้ปัญหาเกิด — ตรวจได้ตั้งแต่ก่อน merge
#
# นโยบายที่ตั้งใจ:
#   พบปัญหา (DETECTED)      -> fail build
#   ตรวจไม่ได้ (CANNOT_CHECK) -> fail build เช่นกัน (exit 2)
#     เพราะเครื่องมือที่บอกว่า "ปลอดภัย" ทั้งที่ไม่ได้ตรวจอะไรเลย
#     อันตรายกว่าไม่มีเครื่องมือ · ทีมที่ยอมรับได้ใส่ --allow-unknown
#
# 🔴 ข้อบังคับที่ตามมาจากนโยบายนั้น — เคยพลาดมาแล้ว ดู H31
#   ถ้าเลือก "CANNOT_CHECK = fail" **สภาพแวดล้อมตัวอย่างต้องทำให้ทุกข้อตรวจได้จริง**
#   ไม่งั้น build จะแดงถาวรโดยไม่มีอะไรผิดจริง แล้วคนจะเรียนรู้ที่จะเพิกเฉยกับ CI
#   ซึ่งแย่กว่าไม่มี CI เลย
#
#   ต้องครบ 2 อย่าง ขาดอย่างใดอย่างหนึ่งก็แดงตลอดกาล:
#     1. ข้อมูลตัวอย่างมี **ทั้ง hnsw และ ivfflat**  — ไม่งั้น Q04 ไม่มี lists ให้เทียบ
#     2. เซิร์ฟเวอร์โหลด **pg_stat_statements** ผ่าน shared_preload_libraries
#        — ไม่งั้น I01 กับ Q02 อ่านประวัติ query ไม่ได้
#        `CREATE EXTENSION` อย่างเดียวไม่พอ มันสร้างได้แต่ query แล้ว error
#
#   ข้อ 2 เป็นเงื่อนไขของตัวเครื่องมือ ไม่ใช่ของ CI — ทีมที่เอา quietfail-check
#   ไปใช้จริงก็ต้องเปิด pg_stat_statements เหมือนกัน ไม่งั้นได้ 2 ข้อที่ตรวจไม่ได้
# ============================================================
name: quietfail-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    # ⚠️ ไม่ใช้ `services:` เพราะมันส่ง command ให้ container ไม่ได้
    #    และ shared_preload_libraries ตั้งผ่าน env ของ postgres image ไม่ได้
    #    ต้องส่งเป็น argument ของ postgres ตอนสตาร์ต จึงต้อง docker run เอง (ดู H31)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ติดตั้ง psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # ล็อกเวอร์ชันเต็ม ไม่ใช้ tag ที่ขยับตาม —
      # tag แบบ :pg17 จะชี้ไปเวอร์ชันใหม่เมื่อไหร่ก็ได้ แล้วผลเทียบกันไม่ได้
      - name: สตาร์ต PostgreSQL + pgvector
        run: |
          docker run -d --name qfdb \
            -e POSTGRES_USER=lab -e POSTGRES_PASSWORD=labpass -e POSTGRES_DB=faultlab \
            -p 5432:5432 \
            pgvector/pgvector:0.8.5-pg17 \
            -c shared_preload_libraries=pg_stat_statements
          for i in $(seq 1 40); do
            if docker exec qfdb pg_isready -U lab -d faultlab >/dev/null 2>&1; then
              echo "พร้อมหลัง ${i} วินาที"; exit 0
            fi
            sleep 1
          done
          echo "::error title=quietfail-check::PostgreSQL ไม่ขึ้นภายใน 40 วินาที"
          docker logs qfdb; exit 1

      - name: เตรียม extension
        env:
          PGPASSWORD: labpass
        run: |
          psql -h localhost -U lab -d faultlab -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"

      # ตรงนี้คือจุดที่ทีมอื่นเอาไปแก้: โหลด schema และข้อมูลของตัวเอง
      # แล้วให้แอปยิง query จริงสักรอบ เพื่อให้ pg_stat_statements มีประวัติ
      - name: โหลด schema ของโปรเจค (ตัวอย่าง)
        env:
          PGPASSWORD: labpass
        run: |
          psql -h localhost -U lab -d faultlab -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS documents (
              id        int PRIMARY KEY,
              category  text NOT NULL,
              embedding vector(384)
          );
          INSERT INTO documents
          SELECT g, 'general',
                 (SELECT array_agg(random())::vector FROM generate_series(1,384))
          FROM generate_series(1, 500) g
          ON CONFLICT DO NOTHING;
          CREATE INDEX IF NOT EXISTS documents_embedding_idx
              ON documents USING hnsw (embedding vector_cosine_ops);

          -- ⚠️ ต้องมี ivfflat ด้วย ไม่งั้น Q04 ตอบ CANNOT_CHECK แล้ว build แดงตลอดกาล
          --    และต้องระบุ lists ตรงๆ เพราะ reloptions เก็บเฉพาะค่าที่เขียนไว้
          --    ค่าปริยายจะไม่ถูกบันทึก ตัวตรวจจึงไม่มี lists ให้เทียบ
          CREATE INDEX IF NOT EXISTS documents_embedding_ivf
              ON documents USING ivfflat (embedding vector_cosine_ops)
              WITH (lists = 10);
          SQL

      # ⚠️ ต้องเป็น ALTER DATABASE ไม่ใช่ SET ระดับ session
      #    ตัวตรวจเปิด connection ของตัวเอง จึงมองไม่เห็นค่าที่ SET ไว้ในเซสชันอื่น
      #    และนั่นถูกต้องแล้ว เพราะ SET ในเซสชันเดียวก็ไม่ได้ปกป้อง production เหมือนกัน
      - name: ตั้ง probes ให้พอกับ lists (สิ่งที่ทีมจริงต้องทำ)
        env:
          PGPASSWORD: labpass
        run: |
          psql -h localhost -U lab -d faultlab -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE faultlab SET ivfflat.probes = 4;"

      - name: ให้แอปยิง query จริง (เพื่อให้ตรวจ I01 · Q02 ได้)
        env:
          PGPASSWORD: labpass
        run: |
          psql -h localhost -U lab -d faultlab -v ON_ERROR_STOP=1 -c "
            SELECT id FROM documents
             ORDER BY embedding <=> (SELECT embedding FROM documents WHERE id = 1)
             LIMIT 10;"

      - name: quietfail-check
        env:
          PGPASSWORD: labpass
        run: |
          python scripts/quietfail_check.py \
            --dsn "postgresql://lab@localhost:5432/faultlab" \
            --max-limit 10 \
            --github \
            --json quietfail-report.json

      - name: เก็บรายงานไว้ดูย้อนหลัง
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quietfail-report
          path: quietfail-report.json
          if-no-files-found: ignore
