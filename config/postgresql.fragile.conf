# =============================================================
# โปรไฟล์ "เปราะ" — จงใจตั้งให้ failure mode เกิดเร็วและเห็นชัด
# ห้ามเอาไปใช้ production เด็ดขาด
# =============================================================

listen_addresses = '*'
port = 5432

# --- ทำให้ connection หมดเร็ว (F01) ---
max_connections = 20
superuser_reserved_connections = 3

# --- ทำให้ต้อง sort ลงดิสก์ตั้งแต่ข้อมูลไม่เยอะ (F06) ---
work_mem = 64kB
temp_file_limit = 64MB

shared_buffers = 128MB
maintenance_work_mem = 64MB
effective_cache_size = 512MB

# --- ทำให้ deadlock ถูกตรวจเจอเร็ว (F02) ---
deadlock_timeout = 200ms

# --- ปิดไว้ก่อน ไม่งั้น F01 จะถูก DB เก็บกวาดให้เอง ---
idle_in_transaction_session_timeout = 0
statement_timeout = 0
lock_timeout = 0

# --- แหล่ง ground truth ทั้งหมดอยู่ตรงนี้ ---
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

auto_explain.log_min_duration = 200ms
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_nested_statements = on

track_io_timing = on
track_activity_query_size = 4096

# --- logging: ทุกอย่างที่เครื่องมือวินิจฉัยต้องอ่าน ---
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_min_duration_statement = 0
log_lock_waits = on
log_temp_files = 0
log_checkpoints = on
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d/%a '

# --- สำคัญมาก: ตรึงภาษาของข้อความ error ---
# ถ้าไม่ตั้ง ข้อความ error อาจเปลี่ยนตาม locale ของเครื่อง
# แล้วตัวจับ pattern ในเครื่องมือจะพังข้ามเครื่อง
lc_messages = 'C'

# --- บริบทไทย: ใช้ทดสอบ F09 (timezone) ---
timezone = 'Asia/Bangkok'
log_timezone = 'Asia/Bangkok'
datestyle = 'iso, dmy'
