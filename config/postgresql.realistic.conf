# =============================================================
# โปรไฟล์ "ปกติ" — ใกล้ค่าที่ระบบจริงตั้งกัน
#
# ใช้เป็นกลุ่มควบคุม: fault ข้อไหนที่ยังเกิดบนโปรไฟล์นี้
# = ปัญหาที่ config ช่วยไม่ได้ ต้องแก้ที่โค้ด/schema
# ส่วนข้อที่หายไป = ปัญหาที่ config กลบไว้ชั่วคราว (ซึ่งอันตรายกว่า)
#
# ตารางเปรียบเทียบสองโปรไฟล์นี้คือหนึ่งในผลลัพธ์ที่ดีที่สุดของโปรเจค
# =============================================================

listen_addresses = '*'
port = 5432

max_connections = 100
superuser_reserved_connections = 3

work_mem = 4MB
temp_file_limit = -1
shared_buffers = 256MB
maintenance_work_mem = 128MB
effective_cache_size = 1GB

deadlock_timeout = 1s

# ระบบจริงส่วนมากตั้งสองอันนี้ไว้ — และมันคือเหตุผลว่าทำไม
# บาง fault ถึงไม่โผล่มาเป็น error แต่ไปโผล่เป็นอย่างอื่นแทน
idle_in_transaction_session_timeout = 60s
statement_timeout = 30s
lock_timeout = 5s

shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.track = all
auto_explain.log_min_duration = 1s
auto_explain.log_analyze = on

track_io_timing = on

logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_min_duration_statement = 1000
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d/%a '

lc_messages = 'C'
timezone = 'Asia/Bangkok'
log_timezone = 'Asia/Bangkok'
